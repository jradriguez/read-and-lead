version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # SDK-coupled versions are reviewed together; retain the manifest's bounds.
    # See docs/toolchain.md#dependency-maintenance.
    versioning-strategy: lockfile-only
    groups:
      development-tools:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      # CodeQL init/analyze exchange version-bound configuration within one job.
      codeql:
        patterns: ["github/codeql-action/*"]
